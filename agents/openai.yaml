interface:
  display_name: "RTL to Formal IP Spec"
  short_description: "Document RTL as a formal IP Spec using VCS + Verdi"
  default_prompt: "Use $rtl-to-spec to read my RTL without modifying it, produce a revision-controlled formal IP Specification with numbered chapters, port/register tables, source-line citations, cycle-accurate WaveDrom figures, and Synopsys VCS/Verdi evidence when available. Do not claim EDA passes unless actually run and checked."
